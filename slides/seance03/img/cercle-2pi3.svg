<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14304a"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="30" y1="200" x2="385" y2="200" stroke="#14304a" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="210" y1="375" x2="210" y2="22" stroke="#14304a" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="378" y="222" font-size="16" fill="#14304a">cos</text>
  <text x="218" y="30" font-size="16" fill="#14304a">sin</text>
  <!-- cercle -->
  <circle cx="210" cy="200" r="140" fill="none" stroke="#14304a" stroke-width="2"/>
  <!-- angles repères -->
  <text x="356" y="192" font-size="15" fill="#14304a">0</text>
  <text x="216" y="54" font-size="15" fill="#14304a">π/2</text>
  <text x="44" y="192" font-size="15" fill="#14304a">π</text>
  <text x="216" y="358" font-size="15" fill="#14304a">3π/2</text>
  <!-- symétrie par rapport à l'axe vertical -->
  <line x1="140" y1="78.76" x2="280" y2="78.76" stroke="#7a8ea3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- rayons -->
  <line x1="210" y1="200" x2="280" y2="78.76" stroke="#2f6fb0" stroke-width="2"/>
  <line x1="210" y1="200" x2="140" y2="78.76" stroke="#c0392b" stroke-width="2.5"/>
  <!-- projections sur l'axe des cos -->
  <line x1="280" y1="78.76" x2="280" y2="200" stroke="#2f6fb0" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="140" y1="78.76" x2="140" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- arcs d'angle -->
  <path d="M245,200 A35,35 0 0 0 227.5,169.69" fill="none" stroke="#2f6fb0" stroke-width="2"/>
  <path d="M265,200 A55,55 0 0 0 182.5,152.37" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="72" font-size="16" fill="#2f6fb0">π/3</text>
  <text x="92" y="72" font-size="16" font-weight="bold" fill="#c0392b">2π/3</text>
  <!-- points -->
  <circle cx="280" cy="78.76" r="5" fill="#2f6fb0"/>
  <circle cx="140" cy="78.76" r="5.5" fill="#c0392b"/>
  <circle cx="280" cy="200" r="4" fill="#2f6fb0"/>
  <circle cx="140" cy="200" r="4.5" fill="#c0392b"/>
  <!-- valeurs du cosinus -->
  <text x="272" y="222" font-size="16" fill="#2f6fb0">1/2</text>
  <text x="120" y="222" font-size="16" font-weight="bold" fill="#c0392b">−1/2</text>
</svg>
